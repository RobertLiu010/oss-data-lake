name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -x -q
        env:
          EMBEDDING_MOCK: "1"

  test-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies with S3 support
        run: pip install -e ".[dev,s3]"
      - name: Run storage pluggable tests
        run: pytest tests/test_storage_pluggable.py -v
        env:
          EMBEDDING_MOCK: "1"

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (local backend)
        run: docker build -t vector-lake:0.1.0 .
      - name: Build Docker image (S3 backend)
        run: docker build --build-arg EXTRAS="[s3]" --build-arg STORAGE_BACKEND=s3 -t vector-lake:0.1.0-s3 .
      - name: Verify image runs
        run: |
          docker run -d --name vl-test -p 8000:8000 \
            -e EMBEDDING_MOCK=1 \
            vector-lake:0.1.0
          sleep 10
          curl -sf http://localhost:8000/health || (docker logs vl-test && exit 1)
          docker stop vl-test
